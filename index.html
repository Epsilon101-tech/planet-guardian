<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planet Guardian | حارس الكوكب</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

        :root {
            --primary: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #030712;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: #f8fafc;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 560px;
            background: radial-gradient(circle at 50% 20%, #0f172a 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 16px;
        }

        /* 1. الترويسة واللغات */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 25;
            height: 38px;
        }

        .brand-title {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        .lang-group {
            display: flex;
            gap: 4px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        /* 2. شريط معلومات اللعبة المقسم هندسياً */
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 5px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 20;
            height: 36px;
        }

        .hud-lives {
            text-align: start;
            font-size: 13px;
            font-weight: 900;
            white-space: nowrap;
        }

        .hearts { color: var(--danger); font-size: 14px; letter-spacing: 1px; }

        .hud-level-container {
            display: flex;
            justify-content: center;
        }

        .level-pill {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            padding: 2px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hud-score {
            text-align: end;
            font-size: 13px;
            font-weight: 900;
            white-space: nowrap;
        }

        #level-banner {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 900;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.7);
            z-index: 40;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
        }

        #level-banner.show { transform: translateX(-50%) scale(1); }

        /* 3. مساحة الفضاء والنجوم */
        #space-area {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            inset: 0;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            opacity: 0.4;
        }

        /* 4. كوكب الأرض السفلي أثناء اللعب */
        #earth-wrapper {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 115%;
            height: 105px;
            z-index: 6;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
        }

        .earth-svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 -6px 20px rgba(56, 189, 248, 0.55));
        }

        /* 5. تصميم النيزك الواقعي المتدرج الألوان والفوهات */
        .meteor {
            position: absolute;
            width: 78px;
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9;
            direction: ltr;
        }

        .meteor-rock {
            position: absolute;
            inset: 0;
            border-radius: 44% 56% 51% 49% / 53% 47% 53% 47%;
            background: 
                radial-gradient(circle at 25% 25%, rgba(254, 240, 138, 0.9) 0%, rgba(249, 115, 22, 0.8) 18%, transparent 40%),
                radial-gradient(circle at 70% 65%, #1c1917 0%, #292524 45%, #44403c 70%, #7c2d12 100%);
            box-shadow: 
                inset -4px -4px 10px rgba(0,0,0,0.85),
                inset 3px 3px 8px rgba(251, 146, 60, 0.8),
                0 0 25px rgba(234, 88, 12, 0.85);
            border: 1.5px solid rgba(253, 186, 116, 0.5);
            overflow: hidden;
        }

        /* فوهات صدمية في النيزك (Craters) */
        .meteor-crater {
            position: absolute;
            border-radius: 50%;
            background: #1c1917;
            box-shadow: inset 1px 1px 3px #000, 0 0 2px rgba(251, 146, 60, 0.5);
        }
        .crater-1 { width: 14px; height: 12px; top: 18px; left: 16px; opacity: 0.85; }
        .crater-2 { width: 10px; height: 9px; bottom: 18px; right: 18px; opacity: 0.8; }
        .crater-3 { width: 8px; height: 8px; top: 46px; left: 34px; opacity: 0.7; }

        /* ذيل البلازما واللهب المتدرج */
        .meteor-flame {
            position: absolute;
            top: -42px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 56px;
            background: linear-gradient(to top, rgba(254, 240, 138, 0.95), rgba(249, 115, 22, 0.85) 45%, rgba(220, 38, 38, 0.5) 75%, transparent);
            border-radius: 50% 50% 25% 25%;
            filter: blur(3px);
            z-index: -1;
            animation: flameThrust 0.12s infinite alternate;
        }

        @keyframes flameThrust {
            from { height: 50px; opacity: 0.85; transform: translateX(-50%) scaleX(0.95); }
            to { height: 60px; opacity: 1; transform: translateX(-50%) scaleX(1.1); }
        }

        .meteor-text {
            position: relative;
            z-index: 2;
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 4px #000, 0 0 8px rgba(0,0,0,0.9);
            background: rgba(15, 23, 42, 0.65);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(254, 215, 170, 0.3);
            white-space: nowrap;
        }

        .meteor.exploded {
            transform: scale(2);
            opacity: 0;
            transition: 0.22s ease-out;
        }

        /* 6. الصاروخ المنطلق */
        .rocket-projectile {
            position: absolute;
            width: 20px;
            height: 38px;
            z-index: 10;
            pointer-events: none;
            transform-origin: 50% 50%;
        }

        .rocket-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #475569 0%, #ffffff 65%, #38bdf8 100%);
            border-radius: 50% 50% 25% 25%;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.95);
            position: relative;
        }

        .rocket-thruster {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 20px;
            background: linear-gradient(to bottom, #fef08a, #f97316, transparent);
            border-radius: 50%;
            filter: blur(2px);
            animation: thrusterPuff 0.08s infinite alternate;
        }

        @keyframes thrusterPuff {
            0% { height: 16px; opacity: 0.8; }
            100% { height: 24px; opacity: 1; }
        }

        /* 7. لوحة الأرقام المدمجة */
        #input-panel {
            background: #090e17;
            padding: 8px 10px 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #screen-display {
            height: 38px;
            background: #111c2e;
            border: 1.5px solid #2563eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #60a5fa;
            letter-spacing: 2px;
            direction: ltr;
        }

        #screen-display.placeholder {
            color: #475569;
            font-size: 13px;
            letter-spacing: 0;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }

        .num-btn {
            height: 38px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: #162236;
            color: #f8fafc;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .num-btn:active { transform: scale(0.92); background: #2563eb; }
        .btn-fire { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-color: #3b82f6; font-size: 18px; }
        .btn-del { background: #2c161d; border-color: #831843; color: #f43f5e; font-size: 16px; }

        /* 8. المشهد الكروي النهائي لكوكب الأرض المدمر والقمر الدوار */
        #cinematic-gameover-scene {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 1s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 12;
        }

        #cinematic-gameover-scene.active {
            opacity: 1;
            transform: scale(1);
        }

        .destroyed-earth-globe {
            position: relative;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #fef08a 0%, #ea580c 25%, #7f1d1d 60%, #1c1917 100%);
            box-shadow: 0 0 50px rgba(234, 88, 12, 0.7), inset -10px -10px 30px #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* صفائح وشقوق الأرض المنشطرة */
        .globe-crust-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: slowPlanetTwist 40s linear infinite;
        }

        @keyframes slowPlanetTwist {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ركام وشظايا الصخور الكوكبية المحيطة */
        .debris-ring {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 1px dashed rgba(245, 158, 11, 0.3);
            pointer-events: none;
            transform: rotateX(72deg);
        }

        /* مدار القمر الدوار */
        .moon-orbit-track {
            position: absolute;
            width: 260px;
            height: 100px;
            border-radius: 50%;
            transform: rotate(-18deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .moon-orbit-rotator {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: orbitMoon 5.5s linear infinite;
        }

        @keyframes orbitMoon {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .moon-sphere {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #f1f5f9 0%, #94a3b8 50%, #475569 85%, #0f172a 100%);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6), inset -2px -2px 4px #000;
        }

        .moon-crater {
            position: absolute;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.45);
        }

        /* 9. مؤثرات الانفجار الكارثي */
        #flash-screen {
            position: absolute;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            transition: opacity 0.15s ease-out;
        }

        #shockwave-ring {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translate(-50%, 50%) scale(0);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 6px solid #f97316;
            box-shadow: 0 0 35px #ef4444;
            opacity: 0;
            pointer-events: none;
            z-index: 25;
        }

        #shockwave-ring.fire {
            animation: shockwaveBoom 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes shockwaveBoom {
            0% { transform: translate(-50%, 50%) scale(0.5); opacity: 1; border-width: 12px; }
            100% { transform: translate(-50%, 50%) scale(9); opacity: 0; border-width: 1px; }
        }

        .debris-piece {
            position: absolute;
            border-radius: 50%;
            background: #ea580c;
            box-shadow: 0 0 12px #f59e0b;
            pointer-events: none;
            z-index: 26;
        }

        .shake-earth {
            animation: intenseScreenShake 1.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes intenseScreenShake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-9px, 7px); }
            20%, 40%, 60%, 80% { transform: translate(9px, -7px); }
        }

        .shake-bump {
            animation: bumpShake 0.25s ease-in-out;
        }
        @keyframes bumpShake {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-4px, 3px); }
        }

        /* الشاشات المنبثقة */
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(7, 13, 25, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            text-align: center;
            padding: 20px;
        }

        .overlay-screen.hidden { display: none !important; }

        /* شاشة النهاية الشفافة لإبراز الكوكب المدمر والقمر خلفها */
        #gameover-modal {
            background: rgba(7, 13, 25, 0.65);
            backdrop-filter: blur(4px);
        }

        .overlay-screen h1 {
            color: #60a5fa;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .overlay-screen p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            max-width: 290px;
            line-height: 1.6;
        }

        .main-btn {
            padding: 12px 36px;
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transition: 0.2s;
            pointer-events: auto;
        }

        .main-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="game-wrapper">

        <div id="flash-screen"></div>
        <div id="shockwave-ring"></div>
        <div id="level-banner">🚀 ترقية! المستوى 2</div>

        <!-- 1. الترويسة واللغات -->
        <div class="top-bar">
            <span class="brand-title">IA MATH GUARDIAN</span>
            <div class="lang-group">
                <button class="lang-btn active" onclick="setLang('ar')">عربي</button>
                <button class="lang-btn" onclick="setLang('fr')">FR</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
        </div>

        <!-- 2. شريط اللعبة -->
        <div class="hud-grid">
            <div class="hud-lives">
                <span id="t-lives">المحاولات:</span> <span id="lives-box" class="hearts">❤️❤️❤️</span>
            </div>
            <div class="hud-level-container">
                <div class="level-pill" id="level-display">المستوى 1</div>
            </div>
            <div class="hud-score">
                <span id="t-score">النقاط:</span> <span id="score-box" style="color: #60a5fa;">0</span>
            </div>
        </div>

        <!-- 3. مساحة الفضاء واللعب -->
        <div id="space-area">
            <div class="stars"></div>
            
            <!-- كوكب الأرض السفلي أثناء اللعب -->
            <div id="earth-wrapper">
                <svg class="earth-svg" viewBox="0 0 500 130" preserveAspectRatio="none">
                    <defs>
                        <radialGradient id="atmoGlow" cx="50%" cy="100%" r="80%">
                            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
                            <stop offset="40%" stop-color="#0284c7" stop-opacity="0.4"/>
                            <stop offset="85%" stop-color="#0369a1" stop-opacity="0.1"/>
                            <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
                        </radialGradient>
                        <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#0284c7"/>
                            <stop offset="35%" stop-color="#0369a1"/>
                            <stop offset="80%" stop-color="#075985"/>
                            <stop offset="100%" stop-color="#082f49"/>
                        </linearGradient>
                    </defs>

                    <path d="M -20 130 Q 250 -35 520 130 Z" fill="url(#atmoGlow)"/>
                    <path d="M 0 130 Q 250 -10 500 130 Z" fill="url(#oceanGrad)"/>

                    <path d="M 25 105 Q 60 40 100 55 Q 130 75 140 100 Q 80 120 25 105 Z" fill="#15803d" opacity="0.95"/>
                    <path d="M 45 95 Q 75 55 105 68 Q 120 85 100 105 Z" fill="#22c55e" opacity="0.9"/>
                    <path d="M 180 65 Q 230 15 285 30 Q 330 50 315 90 Q 260 85 220 80 Q 185 85 180 65 Z" fill="#166534" opacity="0.95"/>
                    <path d="M 215 50 Q 255 25 290 42 Q 280 72 235 68 Z" fill="#22c55e" opacity="0.9"/>
                    <path d="M 370 75 Q 415 35 465 65 Q 490 95 440 115 Q 395 105 370 75 Z" fill="#15803d" opacity="0.95"/>
                    <path d="M 70 60 Q 120 45 160 55 Q 130 70 85 68 Z M 250 35 Q 310 20 360 38 Q 330 52 270 48 Z M 390 60 Q 430 45 470 58 Q 440 70 400 68 Z" fill="#ffffff" opacity="0.32"/>
                </svg>
            </div>

            <!-- المشهد السينمائي لكوكب الأرض الكروي المدمر والقمر الدوار حول الركام -->
            <div id="cinematic-gameover-scene">
                <div class="debris-ring"></div>
                <div class="destroyed-earth-globe">
                    <!-- صفائح متشققة ومحترقة تطفو فوق الحمم -->
                    <svg class="globe-crust-svg" viewBox="0 0 200 200">
                        <!-- قارات متفحمة وكسور -->
                        <path d="M 40 40 Q 75 25 90 60 Q 65 95 30 75 Z" fill="#1c1917" opacity="0.92"/>
                        <path d="M 115 30 Q 160 45 150 90 Q 110 80 100 50 Z" fill="#292524" opacity="0.95"/>
                        <path d="M 35 110 Q 70 120 60 160 Q 25 150 35 110 Z" fill="#1c1917" opacity="0.9"/>
                        <path d="M 105 115 Q 165 110 145 165 Q 90 155 105 115 Z" fill="#292524" opacity="0.92"/>
                        <!-- شروخ الحمم المتوهجة -->
                        <path d="M 90 20 L 105 60 L 85 105 L 125 140 L 95 185" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <path d="M 30 90 L 75 100 L 140 90 L 175 110" stroke="#ef4444" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>

                <!-- مدار القمر والقمر يدور حول ركام الأرض -->
                <div class="moon-orbit-track">
                    <div class="moon-orbit-rotator">
                        <div class="moon-sphere">
                            <div class="moon-crater" style="width: 5px; height: 5px; top: 4px; left: 5px;"></div>
                            <div class="moon-crater" style="width: 4px; height: 4px; bottom: 4px; right: 5px;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="meteor-container"></div>
        </div>

        <!-- 4. لوحة الأرقام المدمجة -->
        <div id="input-panel">
            <div id="screen-display" class="placeholder">اكتب الحل هنا...</div>
            <div class="numpad">
                <button class="num-btn" onclick="pressKey('1')">1</button>
                <button class="num-btn" onclick="pressKey('2')">2</button>
                <button class="num-btn" onclick="pressKey('3')">3</button>
                <button class="num-btn" onclick="pressKey('4')">4</button>
                <button class="num-btn" onclick="pressKey('5')">5</button>
                <button class="num-btn btn-del" onclick="deleteKey()">⌫</button>
                <button class="num-btn" onclick="pressKey('6')">6</button>
                <button class="num-btn" onclick="pressKey('7')">7</button>
                <button class="num-btn" onclick="pressKey('8')">8</button>
                <button class="num-btn" onclick="pressKey('9')">9</button>
                <button class="num-btn" onclick="pressKey('0')">0</button>
                <button class="num-btn btn-fire" onclick="fireAnswer()">🚀</button>
            </div>
        </div>

        <!-- شاشة البداية -->
        <div id="start-modal" class="overlay-screen">
            <h1 id="t-title">حارس الكوكب</h1>
            <p id="t-desc">حل العمليات الحسابية لتدمير النيازك قبل أن تصطدم بالأرض!</p>
            <button class="main-btn" id="t-start-btn" onclick="startGame()">ابدأ اللعب</button>
        </div>

        <!-- شاشة الخسارة -->
        <div id="gameover-modal" class="overlay-screen hidden">
            <h1 id="t-over" style="color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.8);">تدمر الكوكب!</h1>
            <div style="font-size: 16px; margin-bottom: 20px;">
                <span id="t-final">النتيجة النهائية:</span> <strong id="final-score" style="color: #60a5fa; font-size: 34px;">0</strong>
            </div>
            <button class="main-btn" id="t-retry-btn" onclick="startGame()">العب مجدداً</button>
        </div>

    </div>

    <script>
        // ========================================================
        // نظام الصوتيات الفضائية المطور (انفجار ضخم وواقعي)
        // ========================================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // صوت انطلاق الصاروخ الدفاعي
        function soundRocketLaunch() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(160, audioCtx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        // صوت انفجار ناري حقيقي وضخم عند ضرب النيزك
        function soundMeteorExplosion() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const dur = 0.55;

                // 1. موجة ضوضاء قوية محطمة (Debris Crunch)
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                // فلتر تشويش اللهب
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1400, now);
                filter.frequency.exponentialRampToValueAtTime(80, now + dur);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.7, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + dur);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);

                // 2. دوي وتردد هائل ساقط (Sub-Bass Boom)
                const boom = audioCtx.createOscillator();
                const boomGain = audioCtx.createGain();
                boom.type = 'triangle';
                boom.frequency.setValueAtTime(200, now);
                boom.frequency.exponentialRampToValueAtTime(28, now + 0.45);

                boomGain.gain.setValueAtTime(0.85, now);
                boomGain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);

                boom.connect(boomGain);
                boomGain.connect(audioCtx.destination);
                boom.start(now);
                boom.stop(now + 0.45);
            } catch(e) {}
        }

        // صوت اصطدام النيزك بالأرض
        function soundEarthDamage() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(25, now + 0.4);
                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } catch(e) {}
        }

        // صوت الانفجار الكارثي الضخم عند الخسارة
        function soundCatastrophicExplosion() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const dur = 3.6;
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1600, now);
                filter.frequency.exponentialRampToValueAtTime(35, now + dur);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(1.0, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);

                // صوت اهتزاز زلزالي عميق
                const rumble = audioCtx.createOscillator();
                const rumbleGain = audioCtx.createGain();
                rumble.type = 'sawtooth';
                rumble.frequency.setValueAtTime(90, now);
                rumble.frequency.exponentialRampToValueAtTime(18, now + dur);
                rumbleGain.gain.setValueAtTime(0.85, now);
                rumbleGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

                rumble.connect(rumbleGain);
                rumbleGain.connect(audioCtx.destination);
                rumble.start(now);
                rumble.stop(now + dur);
            } catch(e) {}
        }

        // صوت ترقية المستوى
        function soundLevelUp() {
            if (!audioCtx) return;
            try {
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.09);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.09 + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.09);
                    osc.stop(audioCtx.currentTime + idx * 0.09 + 0.22);
                });
            } catch(e) {}
        }

        // صوت نقر الأزرار
        function soundKeyClick() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        // ========================================================
        // اللغات والترجمة
        // ========================================================
        const I18N = {
            ar: {
                title: "حارس الكوكب", desc: "حل العمليات الحسابية لتدمير النيازك قبل أن تصطدم بالأرض!",
                start: "ابدأ اللعب", over: "تدمر الكوكب!", final: "النتيجة النهائية:", retry: "العب مجدداً",
                lives: "المحاولات:", score: "النقاط:", placeholder: "اكتب الحل هنا...",
                level: "المستوى", levelUp: "ترقية! المستوى"
            },
            fr: {
                title: "Gardien de la Planète", desc: "Résolvez les calculs pour détruire les météores avant l'impact !",
                start: "Jouer", over: "Planète Détruite !", final: "Score Final :", retry: "Rejouer",
                lives: "Vies :", score: "Score :", placeholder: "Tapez la réponse...",
                level: "Niveau", levelUp: "Bravo ! Niveau"
            },
            en: {
                title: "Planet Guardian", desc: "Solve math equations to destroy meteors before they hit Earth!",
                start: "Start Game", over: "Planet Destroyed!", final: "Final Score:", retry: "Play Again",
                lives: "Lives:", score: "Score:", placeholder: "Type answer...",
                level: "Level", levelUp: "Level Up! Level"
            }
        };

        let lang = 'ar';
        function setLang(l) {
            initAudio();
            if (!I18N[l]) l = 'ar';
            lang = l;
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('t-title').innerText = I18N[l].title;
            document.getElementById('t-desc').innerText = I18N[l].desc;
            document.getElementById('t-start-btn').innerText = I18N[l].start;
            document.getElementById('t-over').innerText = I18N[l].over;
            document.getElementById('t-final').innerText = I18N[l].final;
            document.getElementById('t-retry-btn').innerText = I18N[l].retry;
            document.getElementById('t-lives').innerText = I18N[l].lives;
            document.getElementById('t-score').innerText = I18N[l].score;
            
            updateLevelDisplay();
            updateDisplay();

            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.innerText.toLowerCase().includes(l) || (l === 'ar' && b.innerText === 'عربي'));
            });
        }

        // مزامنة اللغة مع موقع IA Math
        window.addEventListener('message', function(event) {
            if (event.data && (event.data.lang || event.data.type === 'SET_LANGUAGE')) {
                let targetLang = event.data.lang;
                if (targetLang) {
                    if (targetLang.startsWith('fr')) setLang('fr');
                    else if (targetLang.startsWith('en')) setLang('en');
                    else setLang('ar');
                }
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        if (urlLang && I18N[urlLang]) setLang(urlLang);

        try { window.parent.postMessage({ type: 'GET_LANGUAGE' }, '*'); } catch(e) {}

        // ========================================================
        // لوحة المفاتيح المدمجة
        // ========================================================
        let currentInput = "";
        const screenEl = document.getElementById('screen-display');

        function pressKey(num) {
            initAudio();
            soundKeyClick();
            if (currentInput.length < 5) {
                currentInput += num;
                updateDisplay();
            }
        }

        function deleteKey() {
            initAudio();
            soundKeyClick();
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            if (currentInput === "") {
                screenEl.innerText = I18N[lang].placeholder;
                screenEl.classList.add('placeholder');
            } else {
                screenEl.innerText = currentInput;
                screenEl.classList.remove('placeholder');
            }
        }

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key >= '0' && e.key <= '9') pressKey(e.key);
            else if (e.key === 'Backspace') deleteKey();
            else if (e.key === 'Enter') fireAnswer();
        });

        // ========================================================
        // محرك اللعبة، الصواريخ، وتدمير النيازك
        // ========================================================
        const spaceArea = document.getElementById('space-area');
        const meteorContainer = document.getElementById('meteor-container');
        const earthWrapper = document.getElementById('earth-wrapper');
        const cinematicScene = document.getElementById('cinematic-gameover-scene');
        const gameWrapper = document.getElementById('game-wrapper');
        const flashScreen = document.getElementById('flash-screen');
        const shockwaveRing = document.getElementById('shockwave-ring');
        const levelBanner = document.getElementById('level-banner');

        let score = 0;
        let lives = 3;
        let currentLevel = 1;
        let meteors = [];
        let loopId, spawnId;
        
        let speed = 0.55;
        let spawnTime = 3400;

        function updateLevelDisplay() {
            document.getElementById('level-display').innerText = `${I18N[lang].level} ${currentLevel}`;
        }

        function startGame() {
            initAudio();
            document.getElementById('start-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            
            // إعادة ضبط المشهد السينمائي وإظهار كوكب الأرض العادي
            cinematicScene.classList.remove('active');
            earthWrapper.style.transform = 'translateX(-50%)';
            earthWrapper.style.opacity = '1';
            
            score = 0;
            lives = 3;
            currentLevel = 1;
            speed = 0.55;
            spawnTime = 3400;
            currentInput = "";
            
            updateLevelDisplay();
            updateDisplay();
            
            meteors.forEach(m => m.el.remove());
            meteors = [];
            
            renderHUD();

            clearInterval(loopId);
            clearInterval(spawnId);
            loopId = setInterval(gameLoop, 20);
            spawnId = setInterval(spawnMeteor, spawnTime);
        }

        // توليد النيازك الواقعية
        function spawnMeteor() {
            let n1, n2, op, ans;

            if (currentLevel === 1) {
                op = Math.random() > 0.5 ? '+' : '-';
                if (op === '+') {
                    n1 = Math.floor(Math.random() * 8) + 1;
                    n2 = Math.floor(Math.random() * 8) + 1;
                    ans = n1 + n2;
                } else {
                    n1 = Math.floor(Math.random() * 9) + 4;
                    n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    ans = n1 - n2;
                }
            } else if (currentLevel === 2) {
                op = Math.random() > 0.5 ? '+' : '-';
                if (op === '+') {
                    n1 = Math.floor(Math.random() * 12) + 2;
                    n2 = Math.floor(Math.random() * 12) + 2;
                    ans = n1 + n2;
                } else {
                    n1 = Math.floor(Math.random() * 16) + 4;
                    n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    ans = n1 - n2;
                }
            } else if (currentLevel === 3) {
                const ops = ['+', '-', 'x'];
                op = ops[Math.floor(Math.random() * ops.length)];
                if (op === 'x') {
                    n1 = Math.floor(Math.random() * 4) + 2;
                    n2 = Math.floor(Math.random() * 9) + 1;
                    ans = n1 * n2;
                } else if (op === '+') {
                    n1 = Math.floor(Math.random() * 15) + 3;
                    n2 = Math.floor(Math.random() * 15) + 3;
                    ans = n1 + n2;
                } else {
                    n1 = Math.floor(Math.random() * 20) + 5;
                    n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    ans = n1 - n2;
                }
            } else {
                const ops = ['+', '-', 'x', 'x'];
                op = ops[Math.floor(Math.random() * ops.length)];
                if (op === 'x') {
                    n1 = Math.floor(Math.random() * 8) + 2;
                    n2 = Math.floor(Math.random() * 8) + 2;
                    ans = n1 * n2;
                } else if (op === '+') {
                    n1 = Math.floor(Math.random() * 25) + 5;
                    n2 = Math.floor(Math.random() * 25) + 5;
                    ans = n1 + n2;
                } else {
                    n1 = Math.floor(Math.random() * 30) + 10;
                    n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    ans = n1 - n2;
                }
            }

            const el = document.createElement('div');
            el.className = 'meteor';

            // ذيل اللهب
            const flame = document.createElement('div');
            flame.className = 'meteor-flame';
            el.appendChild(flame);

            // الصخرة وفوهاتها البركانية
            const rock = document.createElement('div');
            rock.className = 'meteor-rock';
            rock.innerHTML = `
                <div class="meteor-crater crater-1"></div>
                <div class="meteor-crater crater-2"></div>
                <div class="meteor-crater crater-3"></div>
            `;
            el.appendChild(rock);

            // نص المسألة الحسابية
            const label = document.createElement('span');
            label.className = 'meteor-text';
            label.innerText = `${n1} ${op === 'x' ? '×' : op} ${n2}`;
            el.appendChild(label);

            const spaceW = spaceArea.offsetWidth;
            const maxLeft = Math.max(10, spaceW - 88);
            const x = Math.floor(Math.random() * maxLeft) + 5;
            el.style.left = `${x}px`;
            el.style.top = '-85px';

            meteorContainer.appendChild(el);
            meteors.push({ el: el, ans: ans, x: x, y: -85, targeted: false });
        }

        function gameLoop() {
            const hitZone = spaceArea.offsetHeight - 45;

            for (let i = 0; i < meteors.length; i++) {
                let m = meteors[i];
                m.y += speed;
                m.el.style.top = `${m.y}px`;

                if (m.y >= hitZone) {
                    m.el.remove();
                    meteors.splice(i, 1);
                    i--;
                    damageEarth();
                }
            }
        }

        function checkLevelProgression() {
            let nextLevel = 1;
            if (score >= 260) nextLevel = 5;
            else if (score >= 180) nextLevel = 4;
            else if (score >= 110) nextLevel = 3;
            else if (score >= 50) nextLevel = 2;

            if (nextLevel > currentLevel) {
                currentLevel = nextLevel;
                updateLevelDisplay();
                soundLevelUp();

                speed += 0.22;
                spawnTime = Math.max(1400, spawnTime - 450);

                clearInterval(spawnId);
                spawnId = setInterval(spawnMeteor, spawnTime);

                levelBanner.innerText = `🚀 ${I18N[lang].levelUp} ${currentLevel}`;
                levelBanner.classList.add('show');
                setTimeout(() => levelBanner.classList.remove('show'), 1600);
            }
        }

        // إطلاق الصاروخ الدفاعي
        function fireAnswer() {
            initAudio();
            if (currentInput === "") return;
            const val = parseInt(currentInput);
            currentInput = "";
            updateDisplay();

            let sorted = meteors.filter(m => !m.targeted).sort((a, b) => b.y - a.y);
            let targetMeteor = sorted.find(m => m.ans === val);

            if (targetMeteor) {
                targetMeteor.targeted = true;
                launchMissileAtMeteor(targetMeteor);
            }
        }

        function launchMissileAtMeteor(targetMeteor) {
            soundRocketLaunch();

            const rocket = document.createElement('div');
            rocket.className = 'rocket-projectile';
            rocket.innerHTML = `
                <div class="rocket-body">
                    <div class="rocket-thruster"></div>
                </div>
            `;
            spaceArea.appendChild(rocket);

            const startX = spaceArea.offsetWidth / 2 - 10;
            const startY = spaceArea.offsetHeight - 35;
            
            const targetX = targetMeteor.x + 39 - 10;
            const targetY = targetMeteor.y + 39 - 18;

            const dx = targetX - startX;
            const dy = targetY - startY;
            const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI + 90;

            rocket.style.left = `${startX}px`;
            rocket.style.top = `${startY}px`;
            rocket.style.transform = `rotate(${angleDeg}deg)`;

            const duration = 280;

            const animation = rocket.animate([
                { transform: `translate(0, 0) rotate(${angleDeg}deg)` },
                { transform: `translate(${dx}px, ${dy}px) rotate(${angleDeg}deg)` }
            ], {
                duration: duration,
                easing: 'linear',
                fill: 'forwards'
            });

            animation.onfinish = function() {
                rocket.remove();
                
                // دوي انفجار ناري حقيقي عند ضرب النيزك
                soundMeteorExplosion();

                // تفتت النيزك وتطاير الشظايا
                createMeteorExplosionParticles(targetMeteor.x + 39, targetMeteor.y + 39);

                targetMeteor.el.classList.add('exploded');
                setTimeout(() => targetMeteor.el.remove(), 220);

                const idx = meteors.indexOf(targetMeteor);
                if (idx !== -1) meteors.splice(idx, 1);

                score += 10;
                renderHUD();
                checkLevelProgression();
            };
        }

        function createMeteorExplosionParticles(x, y) {
            for (let i = 0; i < 16; i++) {
                const p = document.createElement('div');
                p.className = 'debris-piece';
                const s = Math.random() * 7 + 3;
                p.style.width = `${s}px`;
                p.style.height = `${s}px`;
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                spaceArea.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 70 + 20;
                const destX = Math.cos(angle) * dist;
                const destY = Math.sin(angle) * dist;

                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${destX}px, ${destY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 380,
                    easing: 'ease-out',
                    fill: 'forwards'
                });

                setTimeout(() => p.remove(), 420);
            }
        }

        function damageEarth() {
            lives--;
            renderHUD();
            soundEarthDamage();
            
            gameWrapper.classList.remove('shake-bump');
            void gameWrapper.offsetWidth;
            gameWrapper.classList.add('shake-bump');

            if (lives <= 0) {
                triggerCatastrophicExplosion();
            }
        }

        function renderHUD() {
            document.getElementById('score-box').innerText = score;
            let h = '';
            for (let i = 0; i < lives; i++) h += '❤️';
            document.getElementById('lives-box').innerText = h;
        }

        // ========================================================
        // الانفجار الكارثي وعرض كوكب الأرض الكروي المدمر مع القمر
        // ========================================================
        function triggerCatastrophicExplosion() {
            clearInterval(loopId);
            clearInterval(spawnId);

            // دوي الانفجار الكارثي الهائل
            soundCatastrophicExplosion();

            // فلاش الضوء الأبيض
            flashScreen.style.opacity = '0.95';
            setTimeout(() => { flashScreen.style.opacity = '0'; }, 200);

            // إخفاء الأرض السفلية بسلاسة
            earthWrapper.style.transform = 'translateX(-50%) translateY(90px)';
            earthWrapper.style.opacity = '0';

            // تفعيل المشهد الكروي السينمائي لكوكب الأرض المدمر والقمر
            cinematicScene.classList.add('active');

            // انطلاق موجة الصدمة الكوكبية
            shockwaveRing.classList.remove('fire');
            void shockwaveRing.offsetWidth;
            shockwaveRing.classList.add('fire');

            // اهتزاز شديد وعنيف للشاشة
            gameWrapper.classList.add('shake-earth');

            // شظايا الحمم المتطايرة
            const spaceW = spaceArea.offsetWidth;
            const spaceH = spaceArea.offsetHeight;

            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'debris-piece';
                const sz = Math.random() * 9 + 4;
                p.style.width = `${sz}px`;
                p.style.height = `${sz}px`;
                p.style.left = `${spaceW / 2}px`;
                p.style.top = `${spaceH / 2}px`;
                spaceArea.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 190 + 50;
                const destX = Math.cos(angle) * dist;
                const destY = Math.sin(angle) * dist;

                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${destX}px, ${destY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 800 + 600,
                    easing: 'ease-out',
                    fill: 'forwards'
                });

                setTimeout(() => p.remove(), 1500);
            }

            meteors.forEach(m => m.el.remove());
            meteors = [];

            // ====================================================
            // المشهد يبقى ظاهراً لمدة 4 ثوانٍ كاملة قبل ظهور النافذة
            // ====================================================
            setTimeout(() => {
                gameWrapper.classList.remove('shake-earth');
                document.getElementById('final-score').innerText = score;
                document.getElementById('gameover-modal').classList.remove('hidden');
            }, 4000);
        }
    </script>
</body>
</html>
