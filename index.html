<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planet Guardian | حارس الكوكب</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

        :root {
            --primary: #3b82f6;
            --danger: #ef4444;
            --bg: #070d19;
            --card-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: #f8fafc;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 560px;
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 1. الشريط العلوي: اللغات */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 20;
        }

        .lang-group {
            display: flex;
            gap: 6px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* 2. شريط النقاط والمحاولات */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            font-size: 15px;
            font-weight: 900;
            background: rgba(0, 0, 0, 0.25);
            z-index: 15;
        }

        .hearts { color: var(--danger); letter-spacing: 2px; }

        /* 3. مساحة الفضاء وسقوط النيازك */
        #space-area {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            inset: 0;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            opacity: 0.3;
        }

        #earth {
            position: absolute;
            bottom: -35px;
            left: -10%;
            width: 120%;
            height: 75px;
            background: radial-gradient(circle at 50% 10%, #34d399, #064e3b);
            border-radius: 50% 50% 0 0;
            box-shadow: 0 -5px 25px rgba(16, 185, 129, 0.4);
            z-index: 3;
            transition: 0.4s;
        }

        #earth.destroyed {
            background: radial-gradient(circle at 50% 10%, #fef08a, #ef4444, #7f1d1d);
            box-shadow: 0 -10px 40px rgba(239, 68, 68, 0.9);
            filter: brightness(1.5);
        }

        .meteor {
            position: absolute;
            width: 68px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            background: radial-gradient(circle at 30% 30%, #fb923c, #dc2626, #7f1d1d);
            border-radius: 45% 55% 50% 45%;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.8);
            z-index: 4;
            direction: ltr; /* لضبط كتابة العمليات بشكل صحيح دائماً */
        }

        .meteor::after {
            content: '';
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 40px;
            background: linear-gradient(to top, rgba(239, 68, 68, 0.8), transparent);
            border-radius: 50%;
            z-index: -1;
            filter: blur(4px);
        }

        .meteor.hit {
            transform: scale(1.6);
            opacity: 0;
            transition: 0.2s ease-out;
        }

        /* 4. لوحة الإدخال والأرقام المدمجة (تمنع ظهور كيبورد الهاتف نهائياً) */
        #input-panel {
            background: #090e17;
            padding: 8px 12px 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .display-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #screen-display {
            flex: 1;
            height: 40px;
            background: #131d2e;
            border: 1.5px solid #2563eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #60a5fa;
            letter-spacing: 2px;
            direction: ltr;
        }

        #screen-display.placeholder {
            color: #475569;
            font-size: 14px;
            letter-spacing: 0;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }

        .num-btn {
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: #172338;
            color: #f8fafc;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s, background 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .num-btn:active {
            transform: scale(0.92);
            background: #2563eb;
        }

        .btn-fire {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: #3b82f6;
            font-size: 18px;
        }

        .btn-del {
            background: #2d1820;
            border-color: #831843;
            color: #f43f5e;
            font-size: 16px;
        }

        /* الشاشات الترحيبية وشاشة النهاية */
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(7, 13, 25, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            text-align: center;
            padding: 20px;
        }

        .overlay-screen.hidden { display: none !important; }

        .overlay-screen h1 {
            color: #60a5fa;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .overlay-screen p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            max-width: 280px;
            line-height: 1.6;
        }

        .main-btn {
            padding: 12px 36px;
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transition: 0.2s;
        }

        .main-btn:active { transform: scale(0.95); }

        .shake { animation: shakeEffect 0.3s ease-in-out; }
        @keyframes shakeEffect {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-5px, 3px); }
            75% { transform: translate(5px, -3px); }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">

        <!-- 1. شريط اللغات العلوي المستقل -->
        <div class="top-bar">
            <span style="font-size: 12px; color: #64748b; font-weight: bold;">IA Math Games</span>
            <div class="lang-group">
                <button class="lang-btn active" onclick="setLang('ar')">عربي</button>
                <button class="lang-btn" onclick="setLang('fr')">FR</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
        </div>

        <!-- 2. شريط النقاط والقلوب -->
        <div class="hud-bar">
            <div><span id="t-lives">المحاولات:</span> <span id="lives-box" class="hearts">❤️❤️❤️</span></div>
            <div><span id="t-score">النقاط:</span> <span id="score-box" style="color: #60a5fa;">0</span></div>
        </div>

        <!-- 3. مساحة اللعب وسقوط النيازك -->
        <div id="space-area">
            <div class="stars"></div>
            <div id="earth"></div>
            <div id="meteor-container"></div>
        </div>

        <!-- 4. لوحة الأرقام المدمجة (تحل مشكلة الكيبورد تماماً) -->
        <div id="input-panel">
            <div class="display-row">
                <div id="screen-display" class="placeholder">اكتب الحل هنا...</div>
            </div>
            <div class="numpad">
                <button class="num-btn" onclick="pressKey('1')">1</button>
                <button class="num-btn" onclick="pressKey('2')">2</button>
                <button class="num-btn" onclick="pressKey('3')">3</button>
                <button class="num-btn" onclick="pressKey('4')">4</button>
                <button class="num-btn" onclick="pressKey('5')">5</button>
                <button class="num-btn btn-del" onclick="deleteKey()">⌫</button>
                <button class="num-btn" onclick="pressKey('6')">6</button>
                <button class="num-btn" onclick="pressKey('7')">7</button>
                <button class="num-btn" onclick="pressKey('8')">8</button>
                <button class="num-btn" onclick="pressKey('9')">9</button>
                <button class="num-btn" onclick="pressKey('0')">0</button>
                <button class="num-btn btn-fire" onclick="fireAnswer()">🚀</button>
            </div>
        </div>

        <!-- شاشة البداية -->
        <div id="start-modal" class="overlay-screen">
            <h1 id="t-title">حارس الكوكب</h1>
            <p id="t-desc">حل العمليات الحسابية لتدمير النيازك قبل أن تصطدم بالأرض!</p>
            <button class="main-btn" id="t-start-btn" onclick="startGame()">ابدأ اللعب</button>
        </div>

        <!-- شاشة الخسارة وتدمير الكوكب -->
        <div id="gameover-modal" class="overlay-screen hidden">
            <h1 id="t-over" style="color: #ef4444;">تدمر الكوكب!</h1>
            <div style="font-size: 18px; margin-bottom: 20px;">
                <span id="t-final">النتيجة:</span> <strong id="final-score" style="color: #60a5fa; font-size: 32px;">0</strong>
            </div>
            <button class="main-btn" id="t-retry-btn" onclick="startGame()">العب مجدداً</button>
        </div>

    </div>

    <script>
        const I18N = {
            ar: {
                title: "حارس الكوكب", desc: "حل العمليات الحسابية لتدمير النيازك قبل أن تصطدم بالأرض!",
                start: "ابدأ اللعب", over: "تدمر الكوكب!", final: "النتيجة النهائية:", retry: "العب مجدداً",
                lives: "المحاولات:", score: "النقاط:", placeholder: "اكتب الحل هنا..."
            },
            fr: {
                title: "Gardien de la Planète", desc: "Résolvez les calculs pour détruire les météores avant l'impact !",
                start: "Jouer", over: "Planète Détruite !", final: "Score Final :", retry: "Rejouer",
                lives: "Vies :", score: "Score :", placeholder: "Tapez la réponse..."
            },
            en: {
                title: "Planet Guardian", desc: "Solve math problems to destroy meteors before they hit Earth!",
                start: "Start Game", over: "Planet Destroyed!", final: "Final Score:", retry: "Play Again",
                lives: "Lives:", score: "Score:", placeholder: "Type answer..."
            }
        };

        let lang = 'ar';
        function setLang(l) {
            lang = l;
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('t-title').innerText = I18N[l].title;
            document.getElementById('t-desc').innerText = I18N[l].desc;
            document.getElementById('t-start-btn').innerText = I18N[l].start;
            document.getElementById('t-over').innerText = I18N[l].over;
            document.getElementById('t-final').innerText = I18N[l].final;
            document.getElementById('t-retry-btn').innerText = I18N[l].retry;
            document.getElementById('t-lives').innerText = I18N[l].lives;
            document.getElementById('t-score').innerText = I18N[l].score;
            
            updateDisplay();

            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.innerText.toLowerCase().includes(l) || (l==='ar' && b.innerText==='عربي'));
            });
        }

        // منطق الإدخال والشاشة
        let currentInput = "";
        const screenEl = document.getElementById('screen-display');

        function pressKey(num) {
            if (currentInput.length < 5) {
                currentInput += num;
                updateDisplay();
            }
        }

        function deleteKey() {
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            if (currentInput === "") {
                screenEl.innerText = I18N[lang].placeholder;
                screenEl.classList.add('placeholder');
            } else {
                screenEl.innerText = currentInput;
                screenEl.classList.remove('placeholder');
            }
        }

        // دعم لوحة مفاتيح الكمبيوتر أيضاً
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') pressKey(e.key);
            else if (e.key === 'Backspace') deleteKey();
            else if (e.key === 'Enter') fireAnswer();
        });

        // منطق اللعبة
        const meteorContainer = document.getElementById('meteor-container');
        const earthEl = document.getElementById('earth');
        const gameWrapper = document.getElementById('game-wrapper');

        let score = 0;
        let lives = 3;
        let meteors = [];
        let loopId, spawnId;
        let speed = 1.0;
        let spawnTime = 2600;

        function startGame() {
            document.getElementById('start-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            earthEl.classList.remove('destroyed');
            
            score = 0;
            lives = 3;
            speed = 1.0;
            spawnTime = 2600;
            currentInput = "";
            updateDisplay();
            
            meteors.forEach(m => m.el.remove());
            meteors = [];
            
            renderHUD();

            clearInterval(loopId);
            clearInterval(spawnId);
            loopId = setInterval(gameLoop, 20);
            spawnId = setInterval(spawnMeteor, spawnTime);
        }

        function spawnMeteor() {
            const ops = ['+', '-', 'x'];
            const op = ops[Math.floor(Math.random() * ops.length)];
            let n1, n2, ans;

            if (op === '+') {
                n1 = Math.floor(Math.random() * 15) + 1;
                n2 = Math.floor(Math.random() * 15) + 1;
                ans = n1 + n2;
            } else if (op === '-') {
                // منع النواتج السالبة نهائياً
                const big = Math.floor(Math.random() * 20) + 5;
                const small = Math.floor(Math.random() * (big - 1)) + 1;
                n1 = big;
                n2 = small;
                ans = n1 - n2;
            } else {
                n1 = Math.floor(Math.random() * 9) + 2;
                n2 = Math.floor(Math.random() * 9) + 2;
                ans = n1 * n2;
            }

            const el = document.createElement('div');
            el.className = 'meteor';
            el.innerText = `${n1} ${op === 'x' ? '×' : op} ${n2}`;

            const maxW = document.getElementById('space-area').offsetWidth - 75;
            const x = Math.max(10, Math.floor(Math.random() * maxW));
            el.style.left = `${x}px`;
            el.style.top = '-70px';

            meteorContainer.appendChild(el);
            meteors.push({ el: el, ans: ans, y: -70 });
        }

        function gameLoop() {
            const hitZone = document.getElementById('space-area').offsetHeight - 55;

            for (let i = 0; i < meteors.length; i++) {
                let m = meteors[i];
                m.y += speed;
                m.el.style.top = `${m.y}px`;

                if (m.y >= hitZone) {
                    m.el.remove();
                    meteors.splice(i, 1);
                    i--;
                    damageEarth();
                }
            }
        }

        function fireAnswer() {
            if (currentInput === "") return;
            const val = parseInt(currentInput);
            currentInput = "";
            updateDisplay();

            // فحص أقرب نيزك للأرض
            let sorted = [...meteors].sort((a, b) => b.y - a.y);
            for (let i = 0; i < sorted.length; i++) {
                if (sorted[i].ans === val) {
                    let idx = meteors.indexOf(sorted[i]);
                    let m = meteors[idx];
                    m.el.classList.add('hit');
                    setTimeout(() => m.el.remove(), 200);
                    meteors.splice(idx, 1);

                    score += 10;
                    renderHUD();
                    
                    // زيادة الصعوبة تدريجياً
                    if (score % 50 === 0) {
                        speed += 0.2;
                        clearInterval(spawnId);
                        spawnTime = Math.max(900, spawnTime - 250);
                        spawnId = setInterval(spawnMeteor, spawnTime);
                    }
                    break;
                }
            }
        }

        function damageEarth() {
            lives--;
            renderHUD();
            
            gameWrapper.classList.remove('shake');
            void gameWrapper.offsetWidth;
            gameWrapper.classList.add('shake');

            if (lives <= 0) {
                gameOver();
            }
        }

        function renderHUD() {
            document.getElementById('score-box').innerText = score;
            let h = '';
            for (let i = 0; i < lives; i++) h += '❤️';
            document.getElementById('lives-box').innerText = h;
        }

        function gameOver() {
            clearInterval(loopId);
            clearInterval(spawnId);
            earthEl.classList.add('destroyed');
            
            meteors.forEach(m => m.el.remove());
            meteors = [];

            setTimeout(() => {
                document.getElementById('final-score').innerText = score;
                document.getElementById('gameover-modal').classList.remove('hidden');
            }, 800);
        }
    </script>
</body>
</html>
