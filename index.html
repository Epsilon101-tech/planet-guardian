<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planet Guardian | حارس الكوكب</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

        :root {
            --primary: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #030712;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: #f8fafc;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 560px;
            background: radial-gradient(circle at 50% 20%, #0f172a 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 16px;
        }

        /* 1. الترويسة واللغات */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 25;
            height: 38px;
        }

        .brand-title {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        .lang-group {
            display: flex;
            gap: 4px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        /* 2. شريط معلومات اللعبة المقسم هندسياً */
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 5px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 20;
            height: 36px;
        }

        .hud-lives {
            text-align: start;
            font-size: 13px;
            font-weight: 900;
            white-space: nowrap;
        }

        .hearts { color: var(--danger); font-size: 14px; letter-spacing: 1px; }

        .hud-level-container {
            display: flex;
            justify-content: center;
        }

        .level-pill {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            padding: 2px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hud-score {
            text-align: end;
            font-size: 13px;
            font-weight: 900;
            white-space: nowrap;
        }

        /* لافتة ترقية المستوى */
        #level-banner {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 900;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.7);
            z-index: 40;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
        }

        #level-banner.show { transform: translateX(-50%) scale(1); }

        /* 3. مساحة الفضاء والنجوم */
        #space-area {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            inset: 0;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            opacity: 0.4;
        }

        /* 4. كوكب الأرض السينمائي الفاخر */
        #earth-wrapper {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 115%;
            height: 105px;
            z-index: 6;
            pointer-events: none;
            transition: transform 0.3s ease, filter 0.5s ease;
        }

        .earth-svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 -6px 20px rgba(56, 189, 248, 0.55));
        }

        /* الأرض المدمرة بعد الاصطدام الكارثي */
        #earth-wrapper.shattered {
            filter: drop-shadow(0 -10px 40px rgba(239, 68, 68, 0.95)) brightness(1.3) contrast(1.2);
            animation: planetRumble 0.35s infinite alternate;
        }

        @keyframes planetRumble {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.04); }
        }

        /* 5. تصميم النيزك البركاني */
        .meteor {
            position: absolute;
            width: 74px;
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.95);
            border-radius: 46% 54% 50% 50%;
            background: radial-gradient(circle at 35% 35%, #ffedd5 0%, #f97316 40%, #b91c1c 75%, #450a0a 100%);
            box-shadow: 0 0 22px rgba(249, 115, 22, 0.8), inset -3px -3px 8px rgba(0,0,0,0.7);
            border: 1.5px solid rgba(254, 215, 170, 0.4);
            z-index: 9;
            direction: ltr;
        }

        .meteor-flame {
            position: absolute;
            top: -36px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 48px;
            background: linear-gradient(to top, rgba(234, 88, 12, 0.9), rgba(245, 158, 11, 0.6), transparent);
            border-radius: 50% 50% 20% 20%;
            filter: blur(3px);
            z-index: -1;
            animation: flameFlicker 0.15s infinite alternate;
        }

        @keyframes flameFlicker {
            from { height: 44px; opacity: 0.8; }
            to { height: 52px; opacity: 1; transform: translateX(-50%) scaleX(1.1); }
        }

        .meteor.exploded {
            transform: scale(1.8);
            opacity: 0;
            transition: 0.2s ease-out;
        }

        /* 6. الصاروخ المنطلق لضرب النيزك */
        .rocket-projectile {
            position: absolute;
            width: 20px;
            height: 38px;
            z-index: 10;
            pointer-events: none;
            transform-origin: 50% 50%;
        }

        .rocket-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #64748b 0%, #ffffff 60%, #38bdf8 100%);
            border-radius: 50% 50% 25% 25%;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.95);
            position: relative;
        }

        .rocket-thruster {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 20px;
            background: linear-gradient(to bottom, #f59e0b, #ef4444, transparent);
            border-radius: 50%;
            filter: blur(2px);
            animation: thrusterPuff 0.08s infinite alternate;
        }

        @keyframes thrusterPuff {
            0% { height: 16px; opacity: 0.8; }
            100% { height: 24px; opacity: 1; }
        }

        /* 7. لوحة الأرقام المدمجة */
        #input-panel {
            background: #090e17;
            padding: 8px 10px 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #screen-display {
            height: 38px;
            background: #111c2e;
            border: 1.5px solid #2563eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #60a5fa;
            letter-spacing: 2px;
            direction: ltr;
        }

        #screen-display.placeholder {
            color: #475569;
            font-size: 13px;
            letter-spacing: 0;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }

        .num-btn {
            height: 38px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: #162236;
            color: #f8fafc;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .num-btn:active { transform: scale(0.92); background: #2563eb; }
        .btn-fire { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-color: #3b82f6; font-size: 18px; }
        .btn-del { background: #2c161d; border-color: #831843; color: #f43f5e; font-size: 16px; }

        /* 8. مؤثرات الانفجار الكارثي */
        #flash-screen {
            position: absolute;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            transition: opacity 0.15s ease-out;
        }

        #shockwave-ring {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translate(-50%, 50%) scale(0);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 6px solid #f97316;
            box-shadow: 0 0 35px #ef4444;
            opacity: 0;
            pointer-events: none;
            z-index: 25;
        }

        #shockwave-ring.fire {
            animation: shockwaveBoom 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes shockwaveBoom {
            0% { transform: translate(-50%, 50%) scale(0.5); opacity: 1; border-width: 12px; }
            100% { transform: translate(-50%, 50%) scale(9); opacity: 0; border-width: 1px; }
        }

        .debris-piece {
            position: absolute;
            border-radius: 50%;
            background: #ea580c;
            box-shadow: 0 0 12px #f59e0b;
            pointer-events: none;
            z-index: 26;
        }

        .shake-earth {
            animation: intenseScreenShake 1.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes intenseScreenShake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-9px, 7px); }
            20%, 40%, 60%, 80% { transform: translate(9px, -7px); }
        }

        .shake-bump {
            animation: bumpShake 0.25s ease-in-out;
        }
        @keyframes bumpShake {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-4px, 3px); }
        }

        /* الشاشات المنبثقة */
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(7, 13, 25, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            text-align: center;
            padding: 20px;
        }

        .overlay-screen.hidden { display: none !important; }

        .overlay-screen h1 {
            color: #60a5fa;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .overlay-screen p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            max-width: 290px;
            line-height: 1.6;
        }

        .main-btn {
            padding: 12px 36px;
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transition: 0.2s;
        }

        .main-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="game-wrapper">

        <div id="flash-screen"></div>
        <div id="shockwave-ring"></div>
        <div id="level-banner">🚀 ترقية! المستوى 2</div>

        <!-- 1. الترويسة واللغات -->
        <div class="top-bar">
            <span class="brand-title">IA MATH GUARDIAN</span>
            <div class="lang-group">
                <button class="lang-btn active" onclick="setLang('ar')">عربي</button>
                <button class="lang-btn" onclick="setLang('fr')">FR</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
        </div>

        <!-- 2. شريط اللعبة المقسم هندسياً -->
        <div class="hud-grid">
            <div class="hud-lives">
                <span id="t-lives">المحاولات:</span> <span id="lives-box" class="hearts">❤️❤️❤️</span>
            </div>
            <div class="hud-level-container">
                <div class="level-pill" id="level-display">المستوى 1</div>
            </div>
            <div class="hud-score">
                <span id="t-score">النقاط:</span> <span id="score-box" style="color: #60a5fa;">0</span>
            </div>
        </div>

        <!-- 3. الفضاء + كوكب الأرض الواقعي -->
        <div id="space-area">
            <div class="stars"></div>
            
            <div id="earth-wrapper">
                <svg class="earth-svg" viewBox="0 0 500 130" preserveAspectRatio="none">
                    <defs>
                        <radialGradient id="atmoGlow" cx="50%" cy="100%" r="80%">
                            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
                            <stop offset="40%" stop-color="#0284c7" stop-opacity="0.4"/>
                            <stop offset="85%" stop-color="#0369a1" stop-opacity="0.1"/>
                            <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
                        </radialGradient>
                        <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#0284c7"/>
                            <stop offset="35%" stop-color="#0369a1"/>
                            <stop offset="80%" stop-color="#075985"/>
                            <stop offset="100%" stop-color="#082f49"/>
                        </linearGradient>
                        <linearGradient id="lavaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#ef4444"/>
                            <stop offset="50%" stop-color="#f59e0b"/>
                            <stop offset="100%" stop-color="#dc2626"/>
                        </linearGradient>
                    </defs>

                    <!-- هالة الغلاف الجوي -->
                    <path id="earth-atmosphere" d="M -20 130 Q 250 -35 520 130 Z" fill="url(#atmoGlow)"/>

                    <!-- مياه المحيط -->
                    <path id="earth-ocean" d="M 0 130 Q 250 -10 500 130 Z" fill="url(#oceanGrad)"/>

                    <!-- القارات والتضاريس الخضراء -->
                    <path class="earth-land" d="M 25 105 Q 60 40 100 55 Q 130 75 140 100 Q 80 120 25 105 Z" fill="#15803d" opacity="0.95"/>
                    <path class="earth-land" d="M 45 95 Q 75 55 105 68 Q 120 85 100 105 Z" fill="#22c55e" opacity="0.9"/>
                    <path class="earth-land" d="M 180 65 Q 230 15 285 30 Q 330 50 315 90 Q 260 85 220 80 Q 185 85 180 65 Z" fill="#166534" opacity="0.95"/>
                    <path class="earth-land" d="M 215 50 Q 255 25 290 42 Q 280 72 235 68 Z" fill="#22c55e" opacity="0.9"/>
                    <path class="earth-land" d="M 370 75 Q 415 35 465 65 Q 490 95 440 115 Q 395 105 370 75 Z" fill="#15803d" opacity="0.95"/>
                    
                    <!-- سحب الغلاف الجوي -->
                    <path id="earth-clouds" d="M 70 60 Q 120 45 160 55 Q 130 70 85 68 Z M 250 35 Q 310 20 360 38 Q 330 52 270 48 Z M 390 60 Q 430 45 470 58 Q 440 70 400 68 Z" fill="#ffffff" opacity="0.32"/>

                    <!-- شقوق الحمم المتوهجة (تظهر فقط عند تدمير الكوكب) -->
                    <path id="lava-cracks" style="display:none;" d="M 40 90 L 110 50 L 190 70 L 250 15 L 320 65 L 380 40 L 460 70" stroke="url(#lavaGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
                </svg>
            </div>

            <div id="meteor-container"></div>
        </div>

        <!-- 4. لوحة الأرقام المدمجة -->
        <div id="input-panel">
            <div id="screen-display" class="placeholder">اكتب الحل هنا...</div>
            <div class="numpad">
                <button class="num-btn" onclick="pressKey('1')">1</button>
                <button class="num-btn" onclick="pressKey('2')">2</button>
                <button class="num-btn" onclick="pressKey('3')">3</button>
                <button class="num-btn" onclick="pressKey('4')">4</button>
                <button class="num-btn" onclick="pressKey('5')">5</button>
                <button class="num-btn btn-del" onclick="deleteKey()">⌫</button>
                <button class="num-btn" onclick="pressKey('6')">6</button>
                <button class="num-btn" onclick="pressKey('7')">7</button>
                <button class="num-btn" onclick="pressKey('8')">8</button>
                <button class="num-btn" onclick="pressKey('9')">9</button>
                <button class="num-btn" onclick="pressKey('0')">0</button>
                <button class="num-btn btn-fire" onclick="fireAnswer()">🚀</button>
            </div>
        </div>

        <!-- شاشة البداية -->
        <div id="start-modal" class="overlay-screen">
            <h1 id="t-title">حارس الكوكب</h1>
            <p id="t-desc">حل العمليات الحسابية لتدمير النيازك قبل أن تصطدم بالأرض!</p>
            <button class="main-btn" id="t-start-btn" onclick="startGame()">ابدأ اللعب</button>
        </div>

        <!-- شاشة الخسارة -->
        <div id="gameover-modal" class="overlay-screen hidden">
            <h1 id="t-over" style="color: #ef4444;">تدمر الكوكب!</h1>
            <div style="font-size: 16px; margin-bottom: 20px;">
                <span id="t-final">النتيجة النهائية:</span> <strong id="final-score" style="color: #60a5fa; font-size: 32px;">0</strong>
            </div>
            <button class="main-btn" id="t-retry-btn" onclick="startGame()">العب مجدداً</button>
        </div>

    </div>

    <script>
        // ========================================================
        // نظام الصوتيات الفضائية المولد داخلياً (Web Audio API)
        // ========================================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // صوت انطلاق الصاروخ الدفاعي
        function soundRocketLaunch() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(160, audioCtx.currentTime + 0.32);
                
                gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.32);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.32);
            } catch(e) {}
        }

        // صوت انفجار النيزك في الفضاء
        function soundMeteorExplosion() {
            if (!audioCtx) return;
            try {
                const dur = 0.42;
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(900, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();

                // اهتزاز التردد المنخفض Sub-bass
                const sub = audioCtx.createOscillator();
                const subGain = audioCtx.createGain();
                sub.type = 'triangle';
                sub.frequency.setValueAtTime(140, audioCtx.currentTime);
                sub.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.35);
                subGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                subGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

                sub.connect(subGain);
                subGain.connect(audioCtx.destination);
                sub.start();
                sub.stop(audioCtx.currentTime + 0.35);
            } catch(e) {}
        }

        // صوت اصطدام النيزك بالأرض
        function soundEarthDamage() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(110, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.65, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        // صوت الانفجار الكارثي الضخم عند الخسارة (يمتد لأكثر من 3 ثوانٍ)
        function soundCatastrophicExplosion() {
            if (!audioCtx) return;
            try {
                const dur = 3.4;
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + dur);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.95, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();

                // صوت رعد واهتزاز زلزالي عميق
                const rumble = audioCtx.createOscillator();
                const rumbleGain = audioCtx.createGain();
                rumble.type = 'sawtooth';
                rumble.frequency.setValueAtTime(80, audioCtx.currentTime);
                rumble.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + dur);
                rumbleGain.gain.setValueAtTime(0.75, audioCtx.currentTime);
                rumbleGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

                rumble.connect(rumbleGain);
                rumbleGain.connect(audioCtx.destination);
                rumble.start();
                rumble.stop(audioCtx.currentTime + dur);
            } catch(e) {}
        }

        // صوت ترقية المستوى
        function soundLevelUp() {
            if (!audioCtx) return;
            try {
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.09);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.09 + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.09);
                    osc.stop(audioCtx.currentTime + idx * 0.09 + 0.22);
                });
            } catch(e) {}
        }

        // صوت نقر الأزرار
        function soundKeyClick() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(480, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        // ========================================================
        // اللغات والترجمة
        // ========================================================
        const I18N = {
            ar: {
                title: "حارس الكوكب", desc: "حل العمليات الحسابية لتدمير النيازك قبل أن تصطدم بالأرض!",
                start: "ابدأ اللعب", over: "تدمر الكوكب!", final: "النتيجة النهائية:", retry: "العب مجدداً",
                lives: "المحاولات:", score: "النقاط:", placeholder: "اكتب الحل هنا...",
                level: "المستوى", levelUp: "ترقية! المستوى"
            },
            fr: {
                title: "Gardien de la Planète", desc: "Résolvez les calculs pour détruire les météores avant l'impact !",
                start: "Jouer", over: "Planète Détruite !", final: "Score Final :", retry: "Rejouer",
                lives: "Vies :", score: "Score :", placeholder: "Tapez la réponse...",
                level: "Niveau", levelUp: "Bravo ! Niveau"
            },
            en: {
                title: "Planet Guardian", desc: "Solve math equations to destroy meteors before they hit Earth!",
                start: "Start Game", over: "Planet Destroyed!", final: "Final Score:", retry: "Play Again",
                lives: "Lives:", score: "Score:", placeholder: "Type answer...",
                level: "Level", levelUp: "Level Up! Level"
            }
        };

        let lang = 'ar';
        function setLang(l) {
            initAudio();
            if (!I18N[l]) l = 'ar';
            lang = l;
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('t-title').innerText = I18N[l].title;
            document.getElementById('t-desc').innerText = I18N[l].desc;
            document.getElementById('t-start-btn').innerText = I18N[l].start;
            document.getElementById('t-over').innerText = I18N[l].over;
            document.getElementById('t-final').innerText = I18N[l].final;
            document.getElementById('t-retry-btn').innerText = I18N[l].retry;
            document.getElementById('t-lives').innerText = I18N[l].lives;
            document.getElementById('t-score').innerText = I18N[l].score;
            
            updateLevelDisplay();
            updateDisplay();

            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.innerText.toLowerCase().includes(l) || (l === 'ar' && b.innerText === 'عربي'));
            });
        }

        // استقبال وتزامن اللغة مع موقع IA Math
        window.addEventListener('message', function(event) {
            if (event.data && (event.data.lang || event.data.type === 'SET_LANGUAGE')) {
                let targetLang = event.data.lang;
                if (targetLang) {
                    if (targetLang.startsWith('fr')) setLang('fr');
                    else if (targetLang.startsWith('en')) setLang('en');
                    else setLang('ar');
                }
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        if (urlLang && I18N[urlLang]) setLang(urlLang);

        try { window.parent.postMessage({ type: 'GET_LANGUAGE' }, '*'); } catch(e) {}

        // ========================================================
        // لوحة المفاتيح المدمجة
        // ========================================================
        let currentInput = "";
        const screenEl = document.getElementById('screen-display');

        function pressKey(num) {
            initAudio();
            soundKeyClick();
            if (currentInput.length < 5) {
                currentInput += num;
                updateDisplay();
            }
        }

        function deleteKey() {
            initAudio();
            soundKeyClick();
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            if (currentInput === "") {
                screenEl.innerText = I18N[lang].placeholder;
                screenEl.classList.add('placeholder');
            } else {
                screenEl.innerText = currentInput;
                screenEl.classList.remove('placeholder');
            }
        }

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key >= '0' && e.key <= '9') pressKey(e.key);
            else if (e.key === 'Backspace') deleteKey();
            else if (e.key === 'Enter') fireAnswer();
        });

        // ========================================================
        // محرك اللعبة، الصواريخ، وتدمير النيازك
        // ========================================================
        const spaceArea = document.getElementById('space-area');
        const meteorContainer = document.getElementById('meteor-container');
        const earthWrapper = document.getElementById('earth-wrapper');
        const earthAtmosphere = document.getElementById('earth-atmosphere');
        const earthOcean = document.getElementById('earth-ocean');
        const earthLands = document.querySelectorAll('.earth-land');
        const earthClouds = document.getElementById('earth-clouds');
        const lavaCracks = document.getElementById('lava-cracks');
        const gameWrapper = document.getElementById('game-wrapper');
        const flashScreen = document.getElementById('flash-screen');
        const shockwaveRing = document.getElementById('shockwave-ring');
        const levelBanner = document.getElementById('level-banner');

        let score = 0;
        let lives = 3;
        let currentLevel = 1;
        let meteors = [];
        let loopId, spawnId;
        
        let speed = 0.55;
        let spawnTime = 3400;

        function updateLevelDisplay() {
            document.getElementById('level-display').innerText = `${I18N[lang].level} ${currentLevel}`;
        }

        function startGame() {
            initAudio();
            document.getElementById('start-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            
            // إعادة ضبط الأرض لمظهرها الطبيعي الجميل
            earthWrapper.classList.remove('shattered');
            earthAtmosphere.style.display = 'block';
            earthOcean.setAttribute('fill', 'url(#oceanGrad)');
            earthLands.forEach(l => l.style.opacity = '0.95');
            earthClouds.style.opacity = '0.32';
            lavaCracks.style.display = 'none';
            
            score = 0;
            lives = 3;
            currentLevel = 1;
            speed = 0.55;
            spawnTime = 3400;
            currentInput = "";
            
            updateLevelDisplay();
            updateDisplay();
            
            meteors.forEach(m => m.el.remove());
            meteors = [];
            
            renderHUD();

            clearInterval(loopId);
            clearInterval(spawnId);
            loopId = setInterval(gameLoop, 20);
            spawnId = setInterval(spawnMeteor, spawnTime);
        }

        // توليد النيازك حسب التدرج الرياضي
        function spawnMeteor() {
            let n1, n2, op, ans;

            if (currentLevel === 1) {
                op = Math.random() > 0.5 ? '+' : '-';
                if (op === '+') {
                    n1 = Math.floor(Math.random() * 8) + 1;
                    n2 = Math.floor(Math.random() * 8) + 1;
                    ans = n1 + n2;
                } else {
                    n1 = Math.floor(Math.random() * 9) + 4;
                    n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    ans = n1 - n2;
                }
            } else if (currentLevel === 2) {
                op = Math.random() > 0.5 ? '+' : '-';
                if (op === '+') {
                    n1 = Math.floor(Math.random() * 12) + 2;
                    n2 = Math.floor(Math.random() * 12) + 2;
                    ans = n1 + n2;
                } else {
                    n1 = Math.floor(Math.random() * 16) + 4;
                    n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    ans = n1 - n2;
                }
            } else if (currentLevel === 3) {
                const ops = ['+', '-', 'x'];
                op = ops[Math.floor(Math.random() * ops.length)];
                if (op === 'x') {
                    n1 = Math.floor(Math.random() * 4) + 2;
                    n2 = Math.floor(Math.random() * 9) + 1;
                    ans = n1 * n2;
                } else if (op === '+') {
                    n1 = Math.floor(Math.random() * 15) + 3;
                    n2 = Math.floor(Math.random() * 15) + 3;
                    ans = n1 + n2;
                } else {
                    n1 = Math.floor(Math.random() * 20) + 5;
                    n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    ans = n1 - n2;
                }
            } else {
                const ops = ['+', '-', 'x', 'x'];
                op = ops[Math.floor(Math.random() * ops.length)];
                if (op === 'x') {
                    n1 = Math.floor(Math.random() * 8) + 2;
                    n2 = Math.floor(Math.random() * 8) + 2;
                    ans = n1 * n2;
                } else if (op === '+') {
                    n1 = Math.floor(Math.random() * 25) + 5;
                    n2 = Math.floor(Math.random() * 25) + 5;
                    ans = n1 + n2;
                } else {
                    n1 = Math.floor(Math.random() * 30) + 10;
                    n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    ans = n1 - n2;
                }
            }

            const el = document.createElement('div');
            el.className = 'meteor';
            
            const flame = document.createElement('div');
            flame.className = 'meteor-flame';
            el.appendChild(flame);

            const label = document.createElement('span');
            label.innerText = `${n1} ${op === 'x' ? '×' : op} ${n2}`;
            el.appendChild(label);

            const spaceW = spaceArea.offsetWidth;
            const maxLeft = Math.max(10, spaceW - 85);
            const x = Math.floor(Math.random() * maxLeft) + 5;
            el.style.left = `${x}px`;
            el.style.top = '-80px';

            meteorContainer.appendChild(el);
            meteors.push({ el: el, ans: ans, x: x, y: -80, targeted: false });
        }

        function gameLoop() {
            const hitZone = spaceArea.offsetHeight - 45;

            for (let i = 0; i < meteors.length; i++) {
                let m = meteors[i];
                m.y += speed;
                m.el.style.top = `${m.y}px`;

                if (m.y >= hitZone) {
                    m.el.remove();
                    meteors.splice(i, 1);
                    i--;
                    damageEarth();
                }
            }
        }

        function checkLevelProgression() {
            let nextLevel = 1;
            if (score >= 260) nextLevel = 5;
            else if (score >= 180) nextLevel = 4;
            else if (score >= 110) nextLevel = 3;
            else if (score >= 50) nextLevel = 2;

            if (nextLevel > currentLevel) {
                currentLevel = nextLevel;
                updateLevelDisplay();
                soundLevelUp();

                speed += 0.22;
                spawnTime = Math.max(1400, spawnTime - 450);

                clearInterval(spawnId);
                spawnId = setInterval(spawnMeteor, spawnTime);

                levelBanner.innerText = `🚀 ${I18N[lang].levelUp} ${currentLevel}`;
                levelBanner.classList.add('show');
                setTimeout(() => levelBanner.classList.remove('show'), 1600);
            }
        }

        // إطلاق الصاروخ نحو النيزك المستهدف
        function fireAnswer() {
            initAudio();
            if (currentInput === "") return;
            const val = parseInt(currentInput);
            currentInput = "";
            updateDisplay();

            // فحص أقرب نيزك غير مستهدف
            let sorted = meteors.filter(m => !m.targeted).sort((a, b) => b.y - a.y);
            let targetMeteor = sorted.find(m => m.ans === val);

            if (targetMeteor) {
                targetMeteor.targeted = true; // قفل الهدف
                launchMissileAtMeteor(targetMeteor);
            }
        }

        function launchMissileAtMeteor(targetMeteor) {
            soundRocketLaunch();

            // إنشاء عنصر الصاروخ
            const rocket = document.createElement('div');
            rocket.className = 'rocket-projectile';
            rocket.innerHTML = `
                <div class="rocket-body">
                    <div class="rocket-thruster"></div>
                </div>
            `;
            spaceArea.appendChild(rocket);

            const startX = spaceArea.offsetWidth / 2 - 10;
            const startY = spaceArea.offsetHeight - 35;
            
            const targetX = targetMeteor.x + 37 - 10;
            const targetY = targetMeteor.y + 37 - 18;

            const dx = targetX - startX;
            const dy = targetY - startY;
            const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI + 90;

            rocket.style.left = `${startX}px`;
            rocket.style.top = `${startY}px`;
            rocket.style.transform = `rotate(${angleDeg}deg)`;

            const duration = 280; // سرعة الطيران بالمللي ثانية

            const animation = rocket.animate([
                { transform: `translate(0, 0) rotate(${angleDeg}deg)` },
                { transform: `translate(${dx}px, ${dy}px) rotate(${angleDeg}deg)` }
            ], {
                duration: duration,
                easing: 'linear',
                fill: 'forwards'
            });

            animation.onfinish = function() {
                rocket.remove();
                
                // دوي انفجار النيزك
                soundMeteorExplosion();

                // تأثير انفجار النيزك وتطاير الشظايا
                createMeteorExplosionParticles(targetMeteor.x + 37, targetMeteor.y + 37);

                targetMeteor.el.classList.add('exploded');
                setTimeout(() => targetMeteor.el.remove(), 200);

                const idx = meteors.indexOf(targetMeteor);
                if (idx !== -1) meteors.splice(idx, 1);

                score += 10;
                renderHUD();
                checkLevelProgression();
            };
        }

        function createMeteorExplosionParticles(x, y) {
            for (let i = 0; i < 14; i++) {
                const p = document.createElement('div');
                p.className = 'debris-piece';
                const s = Math.random() * 6 + 3;
                p.style.width = `${s}px`;
                p.style.height = `${s}px`;
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                spaceArea.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 60 + 20;
                const destX = Math.cos(angle) * dist;
                const destY = Math.sin(angle) * dist;

                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${destX}px, ${destY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 350,
                    easing: 'ease-out',
                    fill: 'forwards'
                });

                setTimeout(() => p.remove(), 400);
            }
        }

        function damageEarth() {
            lives--;
            renderHUD();
            soundEarthDamage();
            
            gameWrapper.classList.remove('shake-bump');
            void gameWrapper.offsetWidth;
            gameWrapper.classList.add('shake-bump');

            if (lives <= 0) {
                triggerCatastrophicExplosion();
            }
        }

        function renderHUD() {
            document.getElementById('score-box').innerText = score;
            let h = '';
            for (let i = 0; i < lives; i++) h += '❤️';
            document.getElementById('lives-box').innerText = h;
        }

        // ========================================================
        // الانفجار الكارثي وعرض الكوكب المدمّر لمدة 3.5 ثوانٍ كاملة
        // ========================================================
        function triggerCatastrophicExplosion() {
            clearInterval(loopId);
            clearInterval(spawnId);

            // صوت الانفجار الضخم الطويل
            soundCatastrophicExplosion();

            // وميض أبيض أولي
            flashScreen.style.opacity = '0.95';
            setTimeout(() => { flashScreen.style.opacity = '0'; }, 220);

            // تحول الأرض لكوكب مدمر متصدع ومحترق
            earthWrapper.classList.add('shattered');
            earthAtmosphere.style.display = 'none';
            earthOcean.setAttribute('fill', '#1c1917'); // تحول المحيطات لرماد مظلم
            earthLands.forEach(l => l.style.opacity = '0.35');
            earthClouds.style.opacity = '0.08';
            lavaCracks.style.display = 'block'; // شقوق الحمم البركانية تتوهج

            // انطلاق موجة الصدمة
            shockwaveRing.classList.remove('fire');
            void shockwaveRing.offsetWidth;
            shockwaveRing.classList.add('fire');

            // اهتزاز شديد للشاشة
            gameWrapper.classList.add('shake-earth');

            // قذف الحمم والصخور من قلب الكوكب
            const centerX = spaceArea.offsetWidth / 2;
            const centerY = spaceArea.offsetHeight - 30;

            for (let i = 0; i < 28; i++) {
                const p = document.createElement('div');
                p.className = 'debris-piece';
                const sz = Math.random() * 9 + 4;
                p.style.width = `${sz}px`;
                p.style.height = `${sz}px`;
                p.style.left = `${centerX}px`;
                p.style.top = `${centerY}px`;
                spaceArea.appendChild(p);

                const angle = Math.random() * Math.PI - Math.PI; // نصف دائرة نحو الأعلى
                const dist = Math.random() * 200 + 70;
                const destX = Math.cos(angle) * dist;
                const destY = Math.sin(angle) * dist;

                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${destX}px, ${destY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 800 + 500,
                    easing: 'ease-out',
                    fill: 'forwards'
                });

                setTimeout(() => p.remove(), 1400);
            }

            meteors.forEach(m => m.el.remove());
            meteors = [];

            // ====================================================
            // الكوكب المدمر يبقى ظاهراً لمدة 3.5 ثوانٍ كاملة قبل ظهور النافذة
            // ====================================================
            setTimeout(() => {
                gameWrapper.classList.remove('shake-earth');
                document.getElementById('final-score').innerText = score;
                document.getElementById('gameover-modal').classList.remove('hidden');
            }, 3500);
        }
    </script>
</body>
</html>
